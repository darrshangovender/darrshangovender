<title id="t">Darrshan Govender, AI engineer</title>
<desc id="d">Industrial AI, built to be evaluated, audited and trusted. Predictive maintenance, knowledge assistants, supervised agents. An amber vibration trace draws in as the amplitude of a degrading bearing grows.</desc>
