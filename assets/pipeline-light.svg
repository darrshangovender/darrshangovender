<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="t d">
<title id="t">Flagship systems: from sensor data to an approved work order</title>
<desc id="d">Sensor data feeds asset-health, which raises an alert with a remaining-useful-life interval. plant-copilot supplies the cited controlled procedure with its safety clause quoted verbatim. maintenance-agent drafts a work order, a rule-based verifier checks it, and it is held at a human approval gate until a person approves. Small packets travel along the connectors; the gate stays closed until approval.</desc>
