<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 196" width="980" height="196" role="img" aria-labelledby="lp-t lp-d"><title id="lp-t">The maintenance loop</title><desc id="lp-d">Five stages from an alert to a released work order, ending at a human approval gate.</desc><style>@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.b{fill:#121a21;stroke:#aab7c0;stroke-width:1.3}.bk{fill:#1a3236;stroke:#52d6c6;stroke-width:1.8}.bg{fill:#362e2a;stroke:#ff9f5a;stroke-width:2}.bm{fill:#19232c;stroke:#46545f;stroke-width:1.2}.bw{fill:#121a21;stroke:#ff9f5a;stroke-width:1.5;stroke-dasharray:6 4}.t1{font:700 15px 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#edf3f5}.t2{font:400 13px 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#c4cfd5}.tm{font:400 11.5px 'IBM Plex Mono', ui-monospace, 'Cascadia Code', SFMono-Regular, Menlo, Consolas, monospace;fill:#94a3ad;letter-spacing:.04em}.tw{font:400 11.5px 'IBM Plex Mono', ui-monospace, 'Cascadia Code', SFMono-Regular, Menlo, Consolas, monospace;fill:#ff9f5a;letter-spacing:.04em}.ta{font:400 11.5px 'IBM Plex Mono', ui-monospace, 'Cascadia Code', SFMono-Regular, Menlo, Consolas, monospace;fill:#52d6c6;letter-spacing:.04em}.fl{font:400 11.5px 'IBM Plex Mono', ui-monospace, 'Cascadia Code', SFMono-Regular, Menlo, Consolas, monospace;fill:#94a3ad;letter-spacing:.08em}.e{fill:none;stroke:#aab7c0;stroke-width:1.6;stroke-linejoin:round}.ed{fill:none;stroke:#94a3ad;stroke-width:1.4;stroke-dasharray:5 4;stroke-linejoin:round}.ew{fill:none;stroke:#ff9f5a;stroke-width:1.6;stroke-dasharray:6 4;stroke-linejoin:round}.ek{fill:none;stroke:#52d6c6;stroke-width:2;stroke-linejoin:round}.mk{fill:#aab7c0}.mkd{fill:#94a3ad}.mkw{fill:#ff9f5a}.mkk{fill:#52d6c6}.rule{stroke:#46545f;stroke-width:1}.dot{fill:#52d6c6}.dotw{fill:#ff9f5a}.bn-eye{font:400 15px 'IBM Plex Mono', ui-monospace, 'Cascadia Code', SFMono-Regular, Menlo, Consolas, monospace;fill:#52d6c6;letter-spacing:2.1px}.bn-name{font:400 96px 'Instrument Serif', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;fill:#edf3f5;letter-spacing:-2px}.bn-line{font:400 30px 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#edf3f5}.bn-ch{font:700 22px 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#edf3f5}.bn-cs{font:400 16px 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#c4cfd5}.cd-cat{font:400 12px 'IBM Plex Mono', ui-monospace, 'Cascadia Code', SFMono-Regular, Menlo, Consolas, monospace;fill:#52d6c6;letter-spacing:1.6px}.cd-name{font:400 34px 'Instrument Serif', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;fill:#edf3f5}.cd-desc{font:400 14px 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#c4cfd5}.cd-big{font:400 54px 'Instrument Serif', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;fill:#edf3f5;letter-spacing:-1px}.cd-cap{font:400 13px 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#c4cfd5}.cd-tag{font:400 11px 'IBM Plex Mono', ui-monospace, 'Cascadia Code', SFMono-Regular, Menlo, Consolas, monospace;fill:#ff9f5a;letter-spacing:1.2px}.cd-foot{font:400 11px 'IBM Plex Mono', ui-monospace, 'Cascadia Code', SFMono-Regular, Menlo, Consolas, monospace;fill:#94a3ad;letter-spacing:1.2px}.lp-n{font:400 12px 'IBM Plex Mono', ui-monospace, 'Cascadia Code', SFMono-Regular, Menlo, Consolas, monospace;fill:#94a3ad;letter-spacing:1px}.frame{fill:none;stroke:#46545f;stroke-width:1}</style><rect width="980" height="196" rx="10" fill="#0b1014"/><defs><marker id="lp-mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mk" d="M1 1 L9 5 L1 9 z"/></marker><marker id="lp-mkd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkd" d="M1 1 L9 5 L1 9 z"/></marker><marker id="lp-mkw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkw" d="M1 1 L9 5 L1 9 z"/></marker><marker id="lp-mkk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="mkk" d="M1 1 L9 5 L1 9 z"/></marker></defs><text class="lp-n" x="0" y="22">01</text><rect class="b" x="0" y="34" width="180" height="104" rx="6"/><text class="t1" x="12" y="56">asset-health</text><text class="t2" x="12" y="75">Detects a fault and</text><text class="t2" x="12" y="91">gives remaining life</text><text class="t2" x="12" y="107">as an interval.</text><path class="e" d="M180 86 L200 86" marker-end="url(#lp-mk)"/><text class="lp-n" x="200" y="22">02</text><rect class="b" x="200" y="34" width="180" height="104" rx="6"/><text class="t1" x="212" y="56">plant-copilot</text><text class="t2" x="212" y="75">Finds the controlled</text><text class="t2" x="212" y="91">procedure, quotes the</text><text class="t2" x="212" y="107">clause and revision.</text><path class="e" d="M380 86 L400 86" marker-end="url(#lp-mk)"/><text class="lp-n" x="400" y="22">03</text><rect class="b" x="400" y="34" width="180" height="104" rx="6"/><text class="t1" x="412" y="56">maintenance-agent</text><text class="t2" x="412" y="75">Drafts the work order:</text><text class="t2" x="412" y="91">isolation, permits,</text><text class="t2" x="412" y="107">parts, crew, date.</text><path class="ek" d="M580 86 L600 86" marker-end="url(#lp-mkk)"/><text class="lp-n" x="600" y="22">04</text><rect class="bk" x="600" y="34" width="180" height="104" rx="6"/><text class="t1" x="612" y="56">Rule-based verifier</text><text class="t2" x="612" y="75">16 rules, no model,</text><text class="t2" x="612" y="91">check the draft against</text><text class="t2" x="612" y="107">controlled documents.</text><path class="e" d="M780 86 L800 86" marker-end="url(#lp-mk)"/><text class="lp-n" x="800" y="22">05</text><rect class="bg" x="800" y="34" width="180" height="104" rx="6"/><text class="t1" x="812" y="56">Human approval gate</text><text class="t2" x="812" y="75">A person signs the</text><text class="t2" x="812" y="91">exact draft. Nothing is</text><text class="t2" x="812" y="107">created without it.</text><path class="ek" d="M890 138 L890 160" marker-end="url(#lp-mkk)"/><text class="ta" x="890" y="178" text-anchor="middle">WORK ORDER RELEASED</text></svg>
