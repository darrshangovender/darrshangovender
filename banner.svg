<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#121a33"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.80" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- faint grid, very low contrast -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="75"  x2="1200" y2="75"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="900" y1="0" x2="900" y2="300"/>
  </g>

  <g transform="translate(72, 0)">
    <rect x="0" y="62" width="64" height="3" rx="1.5" fill="url(#rule)"/>

    <text x="0" y="106" fill="#f8fafc" font-size="42" font-weight="800" letter-spacing="-0.8">
      Darrshan Govender
    </text>

    <text x="0" y="146" fill="#c7d2fe" font-size="21" font-weight="600">
      AI engineer — I make LLM systems cheaper, faster, and safer.
    </text>

    <text x="0" y="178" fill="#7c8db5" font-size="15" font-weight="400">
      Inference routing · context compression · evaluation · safety gateways
    </text>

    <!-- the four numbers: the actual pitch -->
    <g transform="translate(0, 208)">
      <g>
        <text x="0" y="24" fill="#86efac" font-size="26" font-weight="800">−34%</text>
        <text x="0" y="44" fill="#64748b" font-size="12" letter-spacing="0.6">INFERENCE COST</text>
      </g>
      <g transform="translate(190,0)">
        <text x="0" y="24" fill="#c4b5fd" font-size="26" font-weight="800">92.5%</text>
        <text x="0" y="44" fill="#64748b" font-size="12" letter-spacing="0.6">VS 67.5% BASELINE</text>
      </g>
      <g transform="translate(400,0)">
        <text x="0" y="24" fill="#93c5fd" font-size="26" font-weight="800">−48%</text>
        <text x="0" y="44" fill="#64748b" font-size="12" letter-spacing="0.6">TOKENS, FULL RECALL</text>
      </g>
      <g transform="translate(632,0)">
        <text x="0" y="24" fill="#fda4af" font-size="26" font-weight="800">0%</text>
        <text x="0" y="44" fill="#64748b" font-size="12" letter-spacing="0.6">FALSE POSITIVES</text>
      </g>
    </g>
  </g>

  <!-- availability, right-aligned -->
  <g transform="translate(1128, 0)" text-anchor="end">
    <text x="0" y="72" fill="#86efac" font-size="13" font-weight="700" letter-spacing="0.8">AVAILABLE · CONTRACT &amp; FRACTIONAL</text>
    <text x="0" y="94" fill="#64748b" font-size="13">Durban, South Africa · UTC+2</text>
  </g>

  <text x="72" y="286" fill="#475569" font-size="12">
    Every figure above is reproduced by a benchmark script in its repository.
  </text>
</svg>
